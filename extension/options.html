<!doctype html><html lang="es"><meta charset="utf-8"><title>Memoria WhatsApp · Poliplast</title>
<style>body{font:16px system-ui;max-width:620px;margin:48px auto;padding:0 20px;color:#18221f}label{display:block;margin:18px 0 6px;font-weight:700}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bac7c2;border-radius:8px}button{margin-top:22px;background:#0d7764;color:white;border:0;font-weight:700;cursor:pointer}p{line-height:1.5;color:#52625c}#status{color:#0d7764;font-weight:700}</style>
<h1>Memoria comercial de WhatsApp</h1><p>Configurá este perfil una sola vez. Solo se sincronizan los chats donde actives “Copiloto ON”. La extensión nunca responde mensajes.</p>
<label for="channel">Este perfil corresponde a</label><select id="channel"><option value="general">WhatsApp General · POLIPLAST</option><option value="penosil">WhatsApp Penosil · FOAM</option></select>
<label for="endpoint">CRM</label><input id="endpoint" value="https://poli-crm.vercel.app/api/browser-bridge">
<label for="token">Clave privada del puente</label><input id="token" type="password" autocomplete="off">
<button id="save">Guardar configuración</button><p id="status"></p><script src="options.js"></script></html>
